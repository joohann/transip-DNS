<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TransIP DNS panel — views</title>
<style>
  :root { --w: 1600px; --h: 900px; --screen-w: 1280px; --screen-h: 800px; --scale: .365; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #06090b; }
  .slide { width: var(--w); height: var(--h); position: relative; overflow: hidden;
    background: #0a0f12; font-family: Roboto, system-ui, sans-serif; color: #fff; }
  .slide .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .glow.a { width: 900px; height: 900px; left: -220px; top: -340px; background: #03a9f4; opacity: .30; }
  .glow.b { width: 720px; height: 720px; right: -180px; top: -140px; background: #7c5cff; opacity: .26; }
  .glow.c { width: 640px; height: 640px; left: 540px; bottom: -340px; background: #2ee6c5; opacity: .20; }
  .head { position: relative; padding: 54px 64px 0; }
  .head h1 { font-size: 40px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
  .head p { font-size: 18px; margin: 10px 0 0; color: rgba(255,255,255,.62); }
  .row { position: relative; display: flex; gap: 46px; justify-content: center;
    align-items: flex-start; padding: 170px 52px 0; }
  .item { display: flex; flex-direction: column; align-items: center; }
  .mac { width: calc(var(--screen-w) * var(--scale) + 26px); }
  .lid { padding: 13px 13px 15px; border-radius: 18px; background: #16181b;
    box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 40px 70px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.14); position: relative; }
  .cam { position: absolute; top: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
    border-radius: 50%; background: #2c3034; box-shadow: inset 0 0 2px #000; }
  .screen { width: calc(var(--screen-w) * var(--scale)); height: calc(var(--screen-h) * var(--scale));
    border-radius: 5px; overflow: hidden; background: #fff; position: relative; }
  .screen iframe { width: var(--screen-w); height: var(--screen-h); border: 0;
    transform: scale(var(--scale)); transform-origin: 0 0; }
  .base { width: calc(100% + 26px); margin-left: -13px; height: 14px; border-radius: 0 0 12px 12px;
    background: linear-gradient(#cfd3d8, #8f949b); position: relative;
    box-shadow: 0 16px 26px rgba(0,0,0,.5); }
  .base::after { content: ""; position: absolute; top: 0; left: 50%; width: 96px; height: 6px;
    margin-left: -48px; border-radius: 0 0 7px 7px; background: #aab0b6; }
  .cap { margin-top: 30px; text-align: center; }
  .cap b { display: block; font-size: 19px; font-weight: 500; }
  .cap span { display: block; font-size: 15px; color: rgba(255,255,255,.58); margin-top: 5px; }
  .foot { position: absolute; left: 64px; bottom: 34px; font-size: 14px; color: rgba(255,255,255,.40); }
</style>
</head>
<body>
<div class="slide">
  <div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>

  <div class="head">
    <h1>TransIP DNS panel</h1>
    <p>Liquid glass, three views of the same page</p>
  </div>

  <div class="row">
    <div class="item">
      <div class="mac">
        <div class="lid"><div class="cam"></div>
          <div class="screen"><iframe src="panel-harness.html?lang=en&ipv6=1&clean=1&dark=1"></iframe></div>
        </div>
        <div class="base"></div>
      </div>
      <div class="cap"><b>Overview</b><span>Both address families, records, history</span></div>
    </div>

    <div class="item">
      <div class="mac">
        <div class="lid"><div class="cam"></div>
          <div class="screen"><iframe src="panel-harness.html?lang=en&ipv6=1&clean=1&view=settings"></iframe></div>
        </div>
        <div class="base"></div>
      </div>
      <div class="cap"><b>Settings</b><span>Every setting in one glass dialog</span></div>
    </div>

    <div class="item">
      <div class="mac">
        <div class="lid"><div class="cam"></div>
          <div class="screen"><iframe src="panel-harness.html?lang=en&ipv6=1&clean=1&dark=1&view=combo"></iframe></div>
        </div>
        <div class="base"></div>
      </div>
      <div class="cap"><b>Notify targets</b><span>Combobox with search and custom names</span></div>
    </div>
  </div>

  <div class="foot">Home Assistant custom integration &middot; transip_dns</div>
</div>
</body>
</html>
