<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TransIP DNS panel harness</title>
<style>
  :root {
    --primary-background-color: #f2f4f7;
    --card-background-color: #ffffff;
    --secondary-background-color: #e8eaed;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --divider-color: #e0e0e0;
    --primary-color: #03a9f4;
    --text-primary-color: #ffffff;
    --error-color: #c62828;
    --success-color: #2e7d32;
    --warning-color: #ef6c00;
    --info-color: #0277bd;
    --app-header-background-color: #03a9f4;
    --app-header-text-color: #ffffff;
    --code-font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body.dark {
    --primary-background-color: #111414;
    --card-background-color: #1c1f20;
    --secondary-background-color: #272a2b;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: #333638;
    --app-header-background-color: #1c1f20;
  }
  body { margin: 0; font-family: Roboto, system-ui, sans-serif;
         background: var(--primary-background-color); color: var(--primary-text-color); }
  #tools { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #222; color: #eee; font-size: 13px; }
  #tools button { font: inherit; padding: 4px 10px; }
  #log { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap;
         background: #111; color: #9fe1cb; padding: 8px 12px; max-height: 180px; overflow: auto; }
  /* A stand-in for the Home Assistant frontend around the panel. The panel
     itself never draws this; it only exists so mockups look like real HA. */
  #shell { display: none; }
  body.chrome #shell { display: flex; height: 100vh; overflow: hidden; }
  body.chrome transip-dns-panel { flex: 1; overflow: auto; height: 100vh; }
  #sidebar { width: 256px; flex: none; display: flex; flex-direction: column;
    background: var(--card-background-color); border-right: 1px solid var(--divider-color);
    font-size: 14px; }
  #sidebar .top { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px;
    font-size: 20px; font-weight: 400; }
  #sidebar .burger { width: 24px; height: 24px; color: var(--secondary-text-color); }
  #sidebar nav { flex: 1; padding: 4px 8px; overflow: hidden; }
  #sidebar a { display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 12px;
    border-radius: 10px; color: var(--primary-text-color); text-decoration: none; margin-bottom: 2px; }
  #sidebar a svg { width: 24px; height: 24px; flex: none; color: var(--secondary-text-color); }
  #sidebar a.active { color: var(--primary-color); background: rgba(3,169,244,.14); }
  #sidebar a.active svg { color: var(--primary-color); }
  #sidebar .sep { height: 1px; margin: 8px 12px; background: var(--divider-color); }
  #sidebar .user { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px;
    border-top: 1px solid var(--divider-color); color: var(--primary-text-color); }
  /* Collapsed sidebar: what Home Assistant shows by default on a narrow
     window, and what most people keep on a desktop as well. */
  body.collapsed #sidebar { width: 56px; }
  body.collapsed #sidebar .top { justify-content: center; padding: 0; }
  body.collapsed #sidebar .top span,
  body.collapsed #sidebar a span,
  body.collapsed #sidebar .user span:not(.avatar) { display: none; }
  body.collapsed #sidebar nav { padding: 4px 4px; }
  body.collapsed #sidebar a { justify-content: center; padding: 0; width: 48px; margin: 0 auto 2px; }
  body.collapsed #sidebar .sep { margin: 8px 8px; }
  body.collapsed #sidebar .user { justify-content: center; padding: 0; }
  #sidebar .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-color);
    color: #fff; display: grid; place-items: center; font-size: 13px; }
</style>
</head>
<body>
<div id="tools">
  <strong>harness</strong>
  <button id="toggle-dark">dark mode</button>
  <button id="break">simulate ws error</button>
  <button id="empty">simulate no records</button>
  <span id="nav"></span>
</div>
<div id="log">calls:</div>
<div id="shell">
  <aside id="sidebar"></aside>
  <transip-dns-panel id="panel"></transip-dns-panel>
</div>

<script type="module">
// Cache buster: the harness must always run the file on disk.
await import("../panel/transip-dns-panel.js?v=" + Date.now());

const log = (line) => {
  document.getElementById("log").textContent += "\n" + line;
};

// Query parameters so the mockup page can ask for a specific view:
//   ?lang=en|nl  ?ipv6=1  ?view=settings|combo  ?clean=1  ?dark=1
const params = new URLSearchParams(window.location.search);
if (params.get("clean")) {
  document.getElementById("tools").style.display = "none";
  document.getElementById("log").style.display = "none";
}
if (params.get("dark")) document.body.classList.add("dark");

// Home Assistant's own sidebar, rebuilt here so the mockups show the panel in
// its real surroundings instead of floating on its own.
const MDI = {
  burger: "M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z",
  dashboard: "M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z",
  energy: "M11,15H6L13,1V9H18L11,23V15Z",
  map: "M15,19L9,16.89V5L15,7.11M20.5,3C20.44,3 20.39,3 20.34,3L15,5.1L9,3L3.36,4.9C3.15,4.97 3,5.15 3,5.38V20.5A0.5,0.5 0 0,0 3.5,21C3.55,21 3.61,21 3.66,20.97L9,18.9L15,21L20.64,19.1C20.85,19 21,18.85 21,18.62V3.5A0.5,0.5 0 0,0 20.5,3Z",
  logbook: "M7,5H21V7H7V5M7,13V11H21V13H7M4,4.5A1.5,1.5 0 0,1 5.5,6A1.5,1.5 0 0,1 4,7.5A1.5,1.5 0 0,1 2.5,6A1.5,1.5 0 0,1 4,4.5M4,10.5A1.5,1.5 0 0,1 5.5,12A1.5,1.5 0 0,1 4,13.5A1.5,1.5 0 0,1 2.5,12A1.5,1.5 0 0,1 4,10.5M7,19V17H21V19H7M4,16.5A1.5,1.5 0 0,1 5.5,18A1.5,1.5 0 0,1 4,19.5A1.5,1.5 0 0,1 2.5,18A1.5,1.5 0 0,1 4,16.5Z",
  history: "M5,3H19A2,2 0 0,1 21,5V19A2,2 0 0,1 19,21H5A2,2 0 0,1 3,19V5A2,2 0 0,1 5,3M7,17H9V10H7V17M11,17H13V7H11V17M15,17H17V13H15V17Z",
  media: "M4,6H20V16H4M20,18A2,2 0 0,0 22,16V6C22,4.89 21.1,4 20,4H4C2.89,4 2,4.89 2,6V16A2,2 0 0,0 4,18H0V20H24V18H20Z",
  dns: "M7,9A2,2 0 0,1 5,7A2,2 0 0,1 7,5A2,2 0 0,1 9,7A2,2 0 0,1 7,9M20,3H4A1,1 0 0,0 3,4V10A1,1 0 0,0 4,11H20A1,1 0 0,0 21,10V4A1,1 0 0,0 20,3M7,19A2,2 0 0,1 5,17A2,2 0 0,1 7,15A2,2 0 0,1 9,17A2,2 0 0,1 7,19M20,13H4A1,1 0 0,0 3,14V20A1,1 0 0,0 4,21H20A1,1 0 0,0 21,20V14A1,1 0 0,0 20,13Z",
  tools: "M22.7,19L13.6,9.9C14.5,7.6 14,4.9 12.1,3C10.1,1 7.1,0.6 4.7,1.7L9,6L6,9L1.6,4.7C0.4,7.1 0.9,10.1 2.9,12.1C4.8,14 7.5,14.5 9.8,13.6L18.9,22.7C19.3,23.1 19.9,23.1 20.3,22.7L22.6,20.4C23.1,20 23.1,19.3 22.7,19Z",
  settings: "M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z",
};
const mdi = (name) =>
  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${MDI[name]}"/></svg>`;

if (params.get("chrome")) {
  document.body.classList.add("chrome");
  // Collapsed is the default; ?chrome=wide shows the expanded sidebar.
  if (params.get("chrome") !== "wide") document.body.classList.add("collapsed");
  const english = (params.get("lang") || "nl") === "en";
  const items = [
    ["dashboard", english ? "Overview" : "Overzicht"],
    ["energy", english ? "Energy" : "Energie"],
    ["map", english ? "Map" : "Kaart"],
    ["logbook", english ? "Logbook" : "Logboek"],
    ["history", english ? "History" : "Geschiedenis"],
    ["media", english ? "Media" : "Media"],
  ];
  const lower = [
    ["tools", english ? "Developer tools" : "Ontwikkelhulpmiddelen"],
    ["settings", english ? "Settings" : "Instellingen"],
  ];
  document.getElementById("sidebar").innerHTML = `
    <div class="top">${mdi("burger")}<span>Home Assistant</span></div>
    <nav>
      ${items.map(([i, t]) => `<a href="#">${mdi(i)}<span>${t}</span></a>`).join("")}
      <div class="sep"></div>
      <a href="#" class="active">${mdi("dns")}<span>TransIP DNS</span></a>
      <div class="sep"></div>
      ${lower.map(([i, t]) => `<a href="#">${mdi(i)}<span>${t}</span></a>`).join("")}
    </nav>
    <div class="user"><span class="avatar">J</span><span>Example</span></div>`;
  const burger = document.querySelector("#sidebar .top svg");
  if (burger) { burger.setAttribute("class", "burger"); }
}

const rand = (n) => Math.floor(Math.random() * n);
const randV4 = () => `${rand(223) + 1}.${rand(256)}.${rand(256)}.${rand(254) + 1}`;
const randHextet = () => rand(65536).toString(16).padStart(4, "0");
const randV6 = () =>
  ["2a02", "a45f", randHextet(), randHextet(), randHextet(), randHextet(), randHextet(), randHextet()].join(":");
const V4_NOW = randV4(), V4_WAS = randV4(), V4_OLD = randV4();
const V6_NOW = randV6(), V6_WAS = randV6(), V6_OLD = randV6();
const WITH_V6 = Boolean(params.get("ipv6"));

let failing = false;

const store = {
  entry_id: "01JFAKEENTRY",
  title: "TransIP DNS (example)",
  login: "example",
  options: {
    records: [
      { domain: "example.com", name: "@", record_type: "A" },
      { domain: "example.org", name: "@", record_type: "A" },
      { domain: "example.net", name: "vpn", record_type: "A" },
      ...(WITH_V6 ? [{ domain: "example.com", name: "ha", record_type: "AAAA" }] : []),
    ],
    update_interval: 10,
    notify_persistent: true,
    notify_event: true,
    notify_targets: ["mobile_app_iphone"],
    panel_enabled: true,
    panel_sidebar: false,
  },
  results: {
    "example.com|@|A": { ip: V4_NOW, status: "updated", last_updated: "2026-11-16T04:21:00+00:00" },
    "example.org|@|A": { ip: V4_NOW, status: "ok" },
    "example.net|vpn|A": { ip: V4_NOW, status: "ok" },
    "example.com|ha|AAAA": { ip: V6_NOW, status: "updated", last_updated: "2026-11-16T04:21:00+00:00" },
  },
  ipv4: {
    current: V4_NOW,
    previous: V4_WAS,
    changed_at: "2026-11-16T04:21:00+00:00",
    changes: [
      { from: V4_WAS, to: V4_NOW, at: "2026-11-16T04:21:00+00:00" },
      { from: V4_OLD, to: V4_WAS, at: "2026-11-02T03:58:00+00:00" },
    ],
  },
  ipv6: WITH_V6
    ? {
        current: V6_NOW,
        previous: V6_WAS,
        changed_at: "2026-11-16T04:21:00+00:00",
        changes: [
          { from: V6_WAS, to: V6_NOW, at: "2026-11-16T04:21:00+00:00" },
          { from: V6_OLD, to: V6_WAS, at: "2026-10-28T03:44:00+00:00" },
        ],
      }
    : { current: null, previous: null, changed_at: null, changes: [] },
};

const emptyHistory = { current: null, previous: null, changed_at: null, changes: [] };

const buildInfo = () => ({
  entry_id: store.entry_id,
  title: store.title,
  login: store.login,
  name: "TransIP DNS",
  options: JSON.parse(JSON.stringify(store.options)),
  limits: { min_interval: 2, max_interval: 1440, record_types: ["A", "AAAA"], history_length: 20 },
  notify_targets: ["mobile_app_iphone", "persistent_notification"],
  entries: [{ entry_id: store.entry_id, title: store.title }],
  state: {
    last_update_success: !failing,
    error: failing ? "Could not determine external IPv4 address" : null,
    ipv4: store.ipv4,
    ipv6: store.ipv6,
    records: store.options.records.map((record) => {
      const key = `${record.domain}|${record.name}|${record.record_type}`;
      const result = store.results[key] || {};
      return {
        key,
        domain: record.domain,
        name: record.name,
        record_type: record.record_type,
        ip: result.ip ?? null,
        status: result.status ?? null,
        error: result.error ?? null,
        last_updated: result.last_updated ?? null,
        history: emptyHistory,
      };
    }),
  },
});

const LANGUAGE = params.get("lang") || "nl";
const hass = {
  language: LANGUAGE,
  locale: { language: LANGUAGE },
  async callWS(message) {
    log(`→ ${message.type} ${JSON.stringify({ ...message, type: undefined })}`);
    if (failing && message.type !== "transip_dns/info") {
      throw new Error("Connection lost");
    }
    switch (message.type) {
      case "transip_dns/info":
        return buildInfo();
      case "transip_dns/domains":
        return { domains: ["example.com", "example.org", "example.net"], error: null };
      case "transip_dns/records/set":
        store.options.records = message.records;
        return { records: message.records };
      case "transip_dns/options/set":
        Object.assign(store.options, message.options);
        return { options: store.options };
      case "transip_dns/refresh":
        return { last_update_success: !failing, error: null };
      default:
        throw new Error(`unknown command ${message.type}`);
    }
  },
};

const panel = document.getElementById("panel");
panel.panel = { config: {} };
panel.narrow = false;
panel.route = { path: "" };
panel.hass = hass;

document.getElementById("toggle-dark").addEventListener("click", () => {
  document.body.classList.toggle("dark");
});
document.getElementById("break").addEventListener("click", () => {
  failing = !failing;
  log(`-- failing: ${failing}`);
  panel.hass = hass;
  panel._loadInfo();
});
document.getElementById("empty").addEventListener("click", () => {
  store.options.records = [];
  panel._loadInfo();
});

window.confirm = (text) => {
  log(`confirm: ${text}`);
  return true;
};
// Open a view on request, once the first load has rendered.
const view = params.get("view");
if (view) {
  const ready = setInterval(() => {
    const sr = panel.shadowRoot;
    if (!sr.querySelector("#open-settings")) return;
    clearInterval(ready);
    clearInterval(panel._timer);
    panel._timer = null;
    sr.querySelector("#open-settings").click();
    if (view === "combo") {
      setTimeout(() => panel.shadowRoot.querySelector("#combo-toggle").click(), 60);
    }
  }, 120);
}

panel.addEventListener("location-changed", () => {
  const url = window.location.pathname;
  document.getElementById("nav").textContent = `navigate → ${url}`;
  log(`navigate → ${url}`);
  history.replaceState(null, "", "/tests/panel-harness.html");
});
</script>
</body>
</html>
